<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleuth &amp; Sip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap landing">
  <div class="sunburst"></div>
  <h1>Sleuth &amp; Sip</h1>
  <p class="tagline">The Room That Remembers</p>
  <div class="deco-divider"><span>◆</span></div>
  <div class="mt joinbox">
    <p class="joinlabel">Have a room code? Enter it:</p>
    <div class="b-typed-row" style="margin:0 auto;">
      <input class="tin codein" id="codeIn" placeholder="ABCD" autocomplete="off" maxlength="4" style="text-transform:uppercase">
      <button class="btn primary" id="joinBtn">Join</button>
    </div>
  </div>
  <div class="mt">
    <p class="dim">Hosting a game?</p>
    <button class="btn" id="hostBtn">Host a room — duet (2 players)</button>
  </div>
  <div class="mt">
    <button class="btn" id="hostEnsBtn">Host an ensemble room — up to 24 players</button>
    <p id="hostStatus" class="b-status center" style="min-height:1.4em"></p>
  </div>
  <p class="dim" style="margin-top:2em">A playable social mystery. Two phones and one shared screen,<br>or up to 24 players in teams trading clues toward one solve.</p>
  <div class="mt">
    <p><a href="/kit.html" style="color:var(--dim)">Print the duet kit</a> · <a href="/kit.html?mode=ensemble" style="color:var(--dim)">Print the ensemble kit</a></p>
  </div>
</div>
<script src="/app.js"></script>
<script>
const { api } = window.UNKNOWN;
const hostRoom = async (btn, body) => {
  btn.disabled = true;
  const st = document.getElementById('hostStatus');
  if (st) st.innerHTML = '<span class="spinner"></span>Starting your room — waking the server, one moment…';
  try { const r = await api('/api/room', body); location.href = r.hostUrl; }
  catch (err) { btn.disabled = false; if (st) st.textContent = ''; alert(err.message); }
};
document.getElementById('hostBtn').onclick = (e) => hostRoom(e.target, {});
document.getElementById('hostEnsBtn').onclick = (e) => hostRoom(e.target, { mode: 'ensemble', teamCount: 6 });
const go = () => {
  const c = document.getElementById('codeIn').value.trim().toUpperCase();
  if (c) location.href = '/j/' + c;
};
document.getElementById('joinBtn').onclick = go;
document.getElementById('codeIn').onkeydown = (e) => { if (e.key === 'Enter') go(); };
</script>
</body>
</html>
